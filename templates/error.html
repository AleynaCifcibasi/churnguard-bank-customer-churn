<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }} | Bank Churn Prediction</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='vendor/bootstrap.min.css') }}">
</head>
<body class="bg-light">
  <main class="container d-flex align-items-center justify-content-center" style="min-height: 100vh;">
    <div class="card shadow-sm border-0" style="max-width: 560px; width: 100%;">
      <div class="card-body p-5 text-center">
        <div class="display-4 text-secondary mb-2">{{ code }}</div>
        <h1 class="h4 mb-3">{{ title }}</h1>
        <p class="text-muted mb-4">{{ message }}</p>
        {% if hint %}
        <div class="alert alert-info text-start small mb-4">{{ hint }}</div>
        {% endif %}
        <a href="/" class="btn btn-primary">Ana sayfaya dön</a>
      </div>
    </div>
  </main>
</body>
</html>
